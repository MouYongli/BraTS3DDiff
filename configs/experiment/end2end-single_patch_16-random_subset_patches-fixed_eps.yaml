# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: brats23_patch_diffusion_base
  - override /model: patch_diffusion_base
  - override /callbacks: default
  - override /logger: ['csv', 'wandb']
  - override /trainer: default
  - override /paths: default


# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

paths:
  log_dir: ${paths.root_dir}/logs/bratseg_logs/patch_diffusion

logger:
  wandb:
    tags: ${tags}
    project: BraTS3DDiff
    notes: ${notes}

trainer:
  accelerator: gpu
  devices: [0]


seed: 12345

task_tag: "End2End-PatchSize=16-Random_Subset_Patches_Num_Samples=128-Fixed_eps-TEST"

notes: 'End-to-End patch diffusion training on random subset of 16 patches, num samples=128, Fixed_eps=1e-5'

tags: ['End2End', 'random subset patches', 'patch size=16', 'num samples=128', 'unet_features=half, Fixed_eps=1e-5']

#data and model hparams
roi_size: [128, 128, 128]
classify_patch_sizes: [16, 32]

seg_patch_size: 16
seg_patch_size_: [16]
patch_emb_size: 6
patch_emb_size_: [6]

unet_features: [32, 32, 64, 128, 256, 32]


#patch sampling hparams
eps_data:
  eps_mode: 'fixed'
  eps: 1e-5

num_samples: 128

ckpt_path: null

data:
  _target_: src.datasets.patch_tumor_classify_diffusion_datamodule_new_new.BraTSDataModule
  batch_size: 1
  patch_sizes: ${classify_patch_sizes}
  roi_size: ${roi_size}
  num_workers: 0 ##change later

model:
  _target_: src.models.lit_modules.end2end_train_new.single_patch_random_subset_patches_module.BraTSPatchTumorDiffusionLitModule

  patchify_net:
    _target_: src.models.networks.swinunetr.swinunetr_enc_1x1_conv.NewSwinUNETREnc128
    img_size: ${data.roi_size}
    in_channels: ${data.num_modalities}
    out_channels: 1
    depths: [2, 4, 2, 2]
    num_heads: [3, 6, 12, 24]
    feature_size: 24
    norm_name: "instance"
    drop_rate: 0.0
    attn_drop_rate: 0.0
    dropout_path_rate: 0.0
    normalize: True
    use_checkpoint: False
    spatial_dims: 3
    downsample: "merging"
    use_v2: False
    clamp_out: false

  patch_up_net:
    _target_: src.models.networks.patch_unet.patch_enc.PatchUpsample
    in_sizes: ${patch_emb_size_}
    out_sizes: ${seg_patch_size_}
    in_channels: 1
    out_channels: 1
    ups:
      - _target_: src.models.networks.patch_unet.ups.Up6to16
        spatial_dims: 3
        in_chns: 1
        out_chns: 1
        act: LeakyReLU
        norm: instance
        bias: True
        dropout: 0.0

  patch_emb_net:
    _target_: src.models.networks.patch_unet.patch_enc.PatchUNetEncoder
    spatial_dims: 3
    in_channels: 1
    features: ${unet_features}
    act: LeakyReLU
    norm: instance
    bias: True
    dropout: 0.0

  patch_denoise_net:
    _target_: src.models.networks.patch_unet.patch_unet_denoise.PatchDenoiseUNet
    spatial_dims: 3
    in_channels: ${eval:'${data.num_targets} + 1'}
    out_channels: ${data.num_targets}
    features: ${unet_features}
    act: LeakyReLU
    norm: instance
    dropout: 0.0
    upsample: deconv

  inferer:
    _target_: monai.inferers.SlidingWindowInferer
    roi_size: ${roi_size}
    sw_batch_size: 2
    overlap: 0.50

  extra_kwargs:
    classify_patch_sizes: ${classify_patch_sizes}
    seg_patch_size: ${seg_patch_size}
    patch_emb_size: ${patch_emb_size}
    patch_thresh: 0.70
    log_grad_norm_freq: 1000
    eps_data: ${eps_data}
    num_samples: ${num_samples}






